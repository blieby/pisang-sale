<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pisang Sale Kita</title>

  <style>
    /* =========================================================
       1. WARNA & DASAR
       ========================================================= */
    :root {
      --coklat: #70421f;
      --coklat-muda: #a8651f;
      --cream: #fff8ed;
      --teks: #382719;
      --abu: #82776c;
      --garis: #eadcc9;
      --merah: #b73535;
      --bayangan: 0 8px 25px rgba(80, 48, 20, .08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: var(--cream); color: var(--teks); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    /* =========================================================
       2. KERANGKA HALAMAN (menu samping + isi)
       ========================================================= */
    .layout { display: flex; min-height: 100vh; }

    .sidebar { width: 245px; background: var(--coklat); color: #fff; padding: 28px 20px; position: fixed; inset: 0 auto 0 0; }
    .brand { font-size: 23px; font-weight: bold; margin-bottom: 8px; }
    .brand-sub { color: #f1d9bd; font-size: 13px; line-height: 1.5; margin-bottom: 38px; }
    .nav-title { font-size: 11px; color: #dfc4a4; margin-bottom: 12px; letter-spacing: 1px; }
    .nav-btn { width: 100%; border: 0; background: transparent; color: #fff; text-align: left; padding: 13px 14px; border-radius: 9px; margin-bottom: 7px; font-size: 14px; }
    .nav-btn:hover, .nav-btn.active { background: #95602f; }
    .sidebar-note { position: absolute; bottom: 25px; left: 20px; right: 20px; color: #f1d9bd; font-size: 12px; line-height: 1.6; }

    .main { margin-left: 245px; width: calc(100% - 245px); padding: 30px 38px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 28px; }
    .topbar h1 { font-size: 25px; }
    .topbar p { font-size: 13px; color: var(--abu); margin-top: 6px; }
    .cart-count { background: var(--coklat); color: #fff; padding: 11px 17px; border-radius: 30px; font-size: 13px; }

    /* =========================================================
       3. BANNER & JUDUL BAGIAN
       ========================================================= */
    .hero { background: linear-gradient(120deg, #70421f, #a96d34); color: #fff; border-radius: 17px; padding: 35px; margin-bottom: 28px; box-shadow: var(--bayangan); }
    .hero small { color: #f5dabb; letter-spacing: 1px; font-weight: bold; }
    .hero h2 { font-size: 30px; margin: 13px 0; max-width: 550px; line-height: 1.25; }
    .hero p { max-width: 570px; color: #f8e8d6; line-height: 1.7; font-size: 14px; }

    .section-head { display: flex; justify-content: space-between; align-items: center; margin: 28px 0 17px; gap: 12px; }
    .section-head h2 { font-size: 21px; }
    .section-head p { color: var(--abu); font-size: 13px; margin-top: 5px; }

    /* =========================================================
       4. PRODUK
       ========================================================= */
    .product-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .product-grid.single { grid-template-columns: 1fr; }

    .product-card { background: #fff; border: 1px solid var(--garis); border-radius: 14px; overflow: hidden; box-shadow: var(--bayangan); }
    .product-picture { height: 155px; display: flex; align-items: center; justify-content: center; font-size: 65px; background: #f5e5d0; }
    .product-content { padding: 17px; }
    .product-label { display: inline-block; background: #fff0d8; color: #8a4f16; padding: 5px 9px; border-radius: 20px; font-size: 11px; margin-bottom: 10px; }
    .product-content h3 { font-size: 17px; margin-bottom: 8px; }
    .product-desc { color: var(--abu); font-size: 13px; line-height: 1.5; min-height: 40px; }
    .price { color: var(--coklat); font-weight: bold; font-size: 18px; margin: 14px 0; }
    .price small { font-size: 13px; color: var(--abu); font-weight: normal; }

    .featured { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); }
    .featured .product-picture { height: auto; min-height: 320px; font-size: 120px; }
    .featured .product-content { padding: 32px; }
    .featured h3 { font-size: 26px; }
    .featured .product-desc { font-size: 15px; line-height: 1.7; }
    .featured .price { font-size: 30px; }

    /* =========================================================
       5. KEUNGGULAN & CARA PESAN
       ========================================================= */
    .feature-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .feature { background: #fff; border: 1px solid var(--garis); border-radius: 14px; padding: 22px; box-shadow: var(--bayangan); }
    .feature .ic { font-size: 34px; margin-bottom: 10px; }
    .feature h3 { font-size: 16px; margin-bottom: 7px; }
    .feature p { font-size: 13px; color: var(--abu); line-height: 1.6; }

    .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .step { display: flex; gap: 13px; align-items: flex-start; font-size: 13px; line-height: 1.6; color: var(--abu); }
    .step b { color: var(--teks); display: block; font-size: 15px; }
    .step span { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--coklat); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; }

    /* =========================================================
       6. TOMBOL & KOTAK
       ========================================================= */
    .btn { border: 0; border-radius: 9px; padding: 11px 15px; font-weight: bold; font-size: 13px; }
    .btn-primary { background: var(--coklat); color: #fff; }
    .btn-primary:hover { background: #543016; }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
    .btn-light { background: #f5eadc; color: var(--coklat); }
    .btn-danger { background: #fae7e5; color: var(--merah); }
    .btn-block { width: 100%; }

    .panel { background: #fff; border: 1px solid var(--garis); border-radius: 14px; padding: 22px; box-shadow: var(--bayangan); }
    .empty { text-align: center; color: var(--abu); padding: 45px 15px; line-height: 1.7; }
    .loading { text-align: center; padding: 35px; color: var(--abu); }

    /* =========================================================
       7. KERANJANG (BANYAK PESANAN TERPISAH)
       ========================================================= */
    .cart-row { display: flex; justify-content: space-between; align-items: center; gap: 15px; padding: 17px 0; border-bottom: 1px solid var(--garis); }
    .cart-row:last-child { border-bottom: 0; }
    .cart-row h3 { font-size: 15px; margin-bottom: 6px; }
    .cart-row p { font-size: 13px; color: var(--abu); }
    .qty-control { display: flex; align-items: center; gap: 9px; }
    .qty-control button { width: 29px; height: 29px; border: 1px solid var(--garis); background: var(--cream); border-radius: 7px; }
    .qty-control .btn { width: auto; padding: 0 12px; }
    .total-row { display: flex; justify-content: space-between; padding: 20px 0; font-weight: bold; font-size: 18px; }

    .order-panel { margin-bottom: 18px; }
    .order-panel.aktif { border-color: var(--coklat-muda); box-shadow: 0 0 0 2px #f1d9bd, var(--bayangan); }
    .order-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .order-head .label-input { flex: 1; min-width: 180px; border: 1px solid var(--garis); border-radius: 9px; padding: 10px 12px; font-weight: bold; outline: none; background: #fff; }
    .order-head .label-input:focus { border-color: var(--coklat-muda); }
    .badge-aktif { background: #fff0d8; color: #8a4f16; padding: 6px 11px; border-radius: 20px; font-size: 12px; font-weight: bold; white-space: nowrap; }
    .order-note { font-size: 13px; color: var(--abu); line-height: 1.6; margin-bottom: 18px; }
    .order-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .order-actions .btn-primary { flex: 1; min-width: 200px; }
    .order-empty { color: var(--abu); font-size: 13px; padding: 18px 0; }

    .order-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: #fff; border: 1px solid var(--garis); border-radius: 12px; padding: 12px 15px; margin-bottom: 18px; font-size: 13px; }
    .order-bar select { border: 1px solid var(--garis); border-radius: 9px; padding: 9px 10px; background: #fff; max-width: 100%; }

    /* =========================================================
       8. FORMULIR PEMESANAN
       ========================================================= */
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 17px; }
    .field { margin-bottom: 17px; }
    .field.full { grid-column: 1 / -1; }
    .field label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 8px; }
    .field input, .field textarea, .field select { width: 100%; border: 1px solid var(--garis); border-radius: 9px; padding: 12px; outline: none; background: #fff; }
    .field input:focus, .field textarea:focus { border-color: var(--coklat-muda); }
    .field textarea { min-height: 90px; resize: vertical; }
    .radio-box { display: flex; gap: 12px; flex-wrap: wrap; }
    .radio-option { border: 1px solid var(--garis); padding: 13px; border-radius: 9px; font-size: 13px; flex: 1; min-width: 140px; }
    .radio-option input { width: auto; margin-right: 6px; }
    .notice { background: #fff4df; color: #805019; border-radius: 9px; padding: 13px; font-size: 13px; line-height: 1.5; margin-bottom: 17px; }
    .error-text { color: var(--merah); font-size: 13px; margin: 10px 0; }

    /* =========================================================
       9. HALAMAN BERHASIL & NOTIFIKASI
       ========================================================= */
    .success { text-align: center; padding: 35px 15px; }
    .success-icon { font-size: 55px; margin-bottom: 15px; display: inline-block; animation: popIn .6s cubic-bezier(.2, 1.6, .4, 1) both; }
    .success h2 { margin-bottom: 10px; }
    .success p { color: var(--abu); line-height: 1.7; margin-bottom: 15px; }
    .order-code { display: inline-block; background: #f5eadc; color: var(--coklat); padding: 12px 20px; border-radius: 9px; font-weight: bold; margin: 10px 0 20px; }
    .success-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .toast { position: fixed; right: 25px; bottom: 25px; background: #382719; color: #fff; padding: 14px 18px; border-radius: 10px; font-size: 13px; box-shadow: var(--bayangan); display: none; z-index: 20; }
    .toast.show { display: block; }

    /* =========================================================
       10. TAMPILAN TABLET & HP
       ========================================================= */
    @media (max-width: 1000px) {
      .product-grid:not(.single) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 700px) {
      .layout { display: block; }
      .sidebar { width: 100%; height: auto; position: relative; padding: 16px; }
      .brand { margin-bottom: 12px; }
      .brand-sub, .sidebar-note, .nav-title { display: none; }
      .nav-btn { width: auto; display: inline-block; margin: 0 4px 0 0; padding: 10px; }
      .main { margin-left: 0; width: 100%; padding: 20px 15px; }
      .topbar h1 { font-size: 21px; }
      .hero { padding: 25px; }
      .hero h2 { font-size: 24px; }
      .product-grid, .form-grid, .feature-grid, .steps, .featured { grid-template-columns: 1fr; }
      .featured .product-picture { min-height: 200px; font-size: 90px; }
      .featured .product-content { padding: 22px; }
      .field.full { grid-column: auto; }
      .cart-row { align-items: flex-start; flex-direction: column; }
    }

    /* =========================================================
       11. MASKOT: boneka memegang pisang sale
       ========================================================= */
    .featured .product-picture { background: linear-gradient(160deg, #ffeab0, #ffd36a) !important; }
    .mk-svg { width: min(100%, 320px); height: auto; overflow: visible; }

    .mk-badan  { animation: mkGoyang 2.8s ease-in-out infinite;  transform-box: view-box; transform-origin: 120px 240px; }
    .mk-shadow { animation: mkBayang 2.8s ease-in-out infinite;  transform-box: fill-box; transform-origin: center; }
    .mk-lambai { animation: mkLambai 1.4s ease-in-out infinite;  transform-box: view-box; transform-origin: 80px 152px; }
    .mk-pisang { animation: mkPisang 2.8s ease-in-out infinite;  transform-box: view-box; transform-origin: 193px 140px; }
    .mk-mata   { animation: mkKedip 4s infinite;                 transform-box: fill-box; transform-origin: center; }
    .mk-bubble { animation: mkMuncul 3.2s ease-in-out infinite;  transform-box: fill-box; transform-origin: 50% 100%; }
    .mk-kilau  { animation: mkBerkilau 2s ease-in-out infinite; }

    @keyframes mkGoyang   { 0%,100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-9px) rotate(1.5deg); } }
    @keyframes mkBayang   { 0%,100% { transform: scale(1); opacity: .13; } 50% { transform: scale(.88); opacity: .08; } }
    @keyframes mkLambai   { 0%,100% { transform: rotate(8deg); } 50% { transform: rotate(-16deg); } }
    @keyframes mkPisang   { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(5deg); } }
    @keyframes mkKedip    { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes mkMuncul   { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
    @keyframes mkBerkilau { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

    @media (prefers-reduced-motion: reduce) { .mk-svg * { animation: none !important; } }

    /* =========================================================
       12. DAPUR: beruang koki masak pisang sale
       ========================================================= */
    .dapur { margin-top: 22px; border: 1px solid var(--garis); border-radius: 18px; overflow: hidden; line-height: 0; }
    .dp-svg { width: 100%; height: auto; display: block; }

    .dp-aduk   { animation: dpAduk 1.6s ease-in-out infinite;  transform-box: view-box; transform-origin: 176px 130px; }
    .dp-koki   { animation: dpGoyang 2.4s ease-in-out infinite; transform-box: view-box; transform-origin: 110px 130px; }
    .dp-mata   { animation: dpKedip 4s infinite;               transform-box: fill-box; transform-origin: center; }
    .dp-api    { animation: dpApi .45s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
    .dp-uap    { animation: dpUap 2.4s ease-in infinite;       transform-box: fill-box; }
    .dp-iris   { animation: dpLoncat 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .dp-bubble { animation: dpDenyut 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 20% 100%; }

    @keyframes dpAduk   { 0%,100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
    @keyframes dpGoyang { 0%,100% { transform: rotate(-2deg) translateY(0); } 50% { transform: rotate(2deg) translateY(-3px); } }
    @keyframes dpKedip  { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes dpApi    { from { transform: scaleY(.75); } to { transform: scaleY(1.15); } }
    @keyframes dpUap    { 0% { transform: translateY(0); opacity: 0; } 30% { opacity: .75; } 100% { transform: translateY(-16px); opacity: 0; } }
    @keyframes dpDenyut { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
    @keyframes dpLoncat {
      0%   { transform: translate(0, 0) scale(.6); opacity: 0; }
      15%  { opacity: 1; }
      50%  { transform: translate(var(--dx), -52px) rotate(180deg) scale(1); }
      85%  { transform: translate(calc(var(--dx) * 1.6), -8px) rotate(330deg); opacity: 1; }
      100% { transform: translate(calc(var(--dx) * 1.6), 0) rotate(360deg); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) { .dp-svg * { animation: none !important; } }

    /* =========================================================
       13. KURIR: beruang mengantar pesanan (halaman berhasil)
       ========================================================= */
    .kurir { margin: 8px auto 22px; max-width: 520px; border: 1px solid var(--garis); border-radius: 18px; overflow: hidden; line-height: 0; }
    .kr-svg { width: 100%; height: auto; display: block; }

    .kr-jalan  { animation: krJalan 6s linear infinite; }
    .kr-bob    { animation: krBob .45s ease-in-out infinite alternate; }
    .kr-roda   { animation: krRoda .55s linear infinite; transform-box: fill-box; transform-origin: center; }
    .kr-angin  { animation: krAngin .5s ease-in-out infinite alternate; }
    .kr-awan   { animation: krAwan 14s linear infinite; }
    .kr-garis  { animation: krGaris .7s linear infinite; }
    .kr-bubble { animation: krDenyut 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }

    @keyframes krJalan  { from { transform: translateX(-175px); } to { transform: translateX(455px); } }
    @keyframes krBob    { from { transform: translateY(0); } to { transform: translateY(-2.5px); } }
    @keyframes krRoda   { to { transform: rotate(360deg); } }
    @keyframes krAngin  { from { opacity: .15; transform: translateX(0); } to { opacity: .8; transform: translateX(-7px); } }
    @keyframes krAwan   { from { transform: translateX(0); } to { transform: translateX(-120px); } }
    @keyframes krGaris  { to { stroke-dashoffset: 40; } }
    @keyframes krDenyut { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

    @media (prefers-reduced-motion: reduce) {
      .kr-svg * { animation: none !important; }
      .kr-jalan { transform: translateX(150px); }
      .success-icon { animation: none; }
    }
  </style>
</head>

<body>
  <div class="layout">

    <!-- Menu samping -->
    <aside class="sidebar">
      <div class="brand">🍌 Bilbie Sale</div>
      <div class="brand-sub">Camilan tradisional, teman santai setiap hari.</div>
      <div class="nav-title">MENU UTAMA</div>
      <button class="nav-btn active" data-page="katalog">🏠 Beranda</button>
      <button class="nav-btn" data-page="keranjang">🛒 Keranjang</button>
      <button class="nav-btn" data-page="checkout">📝 Pemesanan</button>
      <div class="sidebar-note">Terima kasih sudah mendukung produk camilan lokal.</div>
    </aside>

    <!-- Isi halaman -->
    <main class="main">
      <div class="topbar">
        <div>
          <h1 id="pageTitle">Pisang Sale Kita</h1>
          <p id="pageSubtitle">Nikmati pisang sale pilihan untuk camilan sehari-hari.</p>
        </div>
        <div class="cart-count">🛒 Keranjang: <span id="cartCount">0</span></div>
      </div>
      <div id="app"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* =========================================================
       1. PENGATURAN (bagian yang paling sering diubah)
       ========================================================= */

    // Alamat file PHP. Relatif, jadi harus dibuka lewat http://localhost/pisang-sale/
    // Gunakan huruf kecil semua supaya aman kalau nanti dipasang di hosting.
    const API_PRODUK = "api/produk.php";
    const API_PESAN  = "api/pesan.php";

    /* =========================================================
       2. DATA
       ========================================================= */
    let PRODUK = [];            // diisi dari database
    let produkSiap = false;     // true setelah produk berhasil dimuat
    let pesananJadi = null;     // hasil pesanan terakhir (nama & nomor pembeli)
    let halaman = "katalog";    // halaman yang sedang tampil

    // BARU: keranjang sekarang berisi BANYAK pesanan yang terpisah.
    // Tiap pesanan = { uid, nama, items: [{ id, qty }] }
    let pesananList = [];       // semua pesanan yang belum dikirim
    let aktifUid = null;        // pesanan yang sedang menerima produk baru
    let checkoutUid = null;     // pesanan yang sedang diisi di formulir

    const $ = id => document.getElementById(id);

    /* =========================================================
       3. ALAT BANTU
       ========================================================= */
    function rupiah(angka) {
      return "Rp" + Number(angka || 0).toLocaleString("id-ID");
    }

    // Mencegah teks dari database/pengguna merusak tampilan halaman
    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[c]));
    }

    function tampilToast(pesan) {
      const toast = $("toast");
      toast.textContent = pesan;
      toast.classList.add("show");
      clearTimeout(tampilToast.t);
      tampilToast.t = setTimeout(() => toast.classList.remove("show"), 2500);
    }

    function cariProduk(id) {
      return PRODUK.find(p => Number(p.id) === Number(id));
    }

    /* =========================================================
       4. KERANJANG: BANYAK PESANAN TERPISAH
       Satu pesanan = satu pemesan. Produk hanya masuk ke
       pesanan yang dipilih (aktif), jadi pesanan orang lain
       tidak ikut tercampur.
       ========================================================= */
    function uidBaru() {
      return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function pesananKosong() {
      return { uid: uidBaru(), nama: "", items: [] };
    }

    function cariPesanan(uid) {
      return pesananList.find(o => o.uid === uid);
    }

    function pesananAktif() {
      return cariPesanan(aktifUid) || pesananList[0];
    }

    function namaPesanan(o) {
      return o.nama || "Pesanan " + (pesananList.indexOf(o) + 1);
    }

    function jumlahBungkus(o) {
      return o.items.reduce((t, i) => t + Number(i.qty || 0), 0);
    }

    function hitungTotal(o) {
      return o.items.reduce((total, item) => {
        const p = cariProduk(item.id);
        return total + (p ? p.price * Number(item.qty) : 0);
      }, 0);
    }

    function muatKeranjang() {
      try {
        const simpanan = JSON.parse(localStorage.getItem("ps_orders") || "null");
        if (simpanan && Array.isArray(simpanan.list)) {
          pesananList = simpanan.list;
          aktifUid = simpanan.aktif;
        } else {
          // Pindahkan keranjang versi lama (satu keranjang) ke format baru
          const lama = JSON.parse(localStorage.getItem("ps_cart") || "[]");
          if (Array.isArray(lama) && lama.length) pesananList = [{ uid: uidBaru(), nama: "", items: lama }];
        }
      } catch (e) { pesananList = []; }

      pesananList = pesananList
        .filter(o => o && o.uid && Array.isArray(o.items))
        .map(o => ({ uid: String(o.uid), nama: String(o.nama || ""), items: o.items.map(i => ({ id: Number(i.id), qty: Number(i.qty) })) }));

      if (!pesananList.length) pesananList = [pesananKosong()];
      if (!cariPesanan(aktifUid)) aktifUid = pesananList[0].uid;
    }

    function simpanKeranjang() {
      try { localStorage.setItem("ps_orders", JSON.stringify({ list: pesananList, aktif: aktifUid })); } catch (e) {}
      updateJumlahKeranjang();
    }

    function updateJumlahKeranjang() {
      $("cartCount").textContent = pesananList.reduce((t, o) => t + jumlahBungkus(o), 0);
    }

    function tambahProduk(id, jumlah = 1, uid) {
      if (!produkSiap || !cariProduk(id)) return;
      const o = cariPesanan(uid) || pesananAktif();
      const item = o.items.find(i => Number(i.id) === Number(id));
      if (item) item.qty += jumlah;
      else o.items.push({ id: Number(id), qty: jumlah });
      simpanKeranjang();
      tampilkan();
      tampilToast("Ditambahkan ke " + namaPesanan(o) + ".");
    }

    function ubahJumlah(uid, id, perubahan) {
      const o = cariPesanan(uid);
      if (!o) return;
      const item = o.items.find(i => Number(i.id) === Number(id));
      if (!item) return;
      item.qty += perubahan;
      if (item.qty <= 0) o.items = o.items.filter(i => Number(i.id) !== Number(id));
      simpanKeranjang();
      tampilkan();
    }

    function hapusProduk(uid, id) {
      const o = cariPesanan(uid);
      if (!o) return;
      o.items = o.items.filter(i => Number(i.id) !== Number(id));
      simpanKeranjang();
      tampilkan();
      tampilToast("Produk dihapus dari " + namaPesanan(o) + ".");
    }

    function pesananBaru() {
      const o = pesananKosong();
      pesananList.push(o);
      aktifUid = o.uid;
      simpanKeranjang();
      tampilkan();
      tampilToast(namaPesanan(o) + " dibuat. Produk berikutnya masuk ke sini.");
    }

    function hapusPesanan(uid) {
      const o = cariPesanan(uid);
      if (!o) return;
      pesananList = pesananList.filter(x => x.uid !== uid);
      if (!pesananList.length) pesananList = [pesananKosong()];
      if (!cariPesanan(aktifUid)) aktifUid = pesananList[0].uid;
      simpanKeranjang();
      tampilkan();
      tampilToast("Pesanan dihapus.");
    }

    /* =========================================================
       5. MEMUAT PRODUK DARI DATABASE
       Kalau gagal, layar menampilkan penyebabnya.
       ========================================================= */
    async function muatProduk() {
      const app = $("app");

      // Dibuka langsung dari file (klik dua kali)? PHP tidak bisa jalan.
      if (location.protocol === "file:") {
        app.innerHTML = `
          <div class="panel empty">
            <h3>Buka lewat Laragon ya</h3>
            <p>Halaman ini dibuka langsung dari file, jadi PHP dan database tidak bisa jalan.</p>
            <p>Nyalakan Laragon (Start All), lalu buka:<br><b>http://localhost/pisang-sale/</b></p>
          </div>`;
        return;
      }

      app.innerHTML = '<div class="panel loading">Sedang mengambil data produk...</div>';

      try {
        const response = await fetch(API_PRODUK, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`File ${API_PRODUK} tidak bisa dibuka (kode ${response.status}). Periksa nama file dan folder api.`);
        }

        const teks = await response.text();
        let data;
        try { data = JSON.parse(teks); }
        catch (e) {
          throw new Error(`Jawaban dari ${API_PRODUK} bukan data produk. Periksa isi file PHP-nya (baris <?php di paling atas, dan tidak ada tulisan error).`);
        }
        if (!Array.isArray(data)) throw new Error(data.pesan || "Format data produk tidak sesuai.");

        PRODUK = data.map(p => ({
          id: Number(p.id),
          name: p.nama,
          price: Number(p.harga),
          c: /^#[0-9a-fA-F]{6}$/.test(p.warna || "") ? p.warna : "#f5e5d0",
          tag: p.label || "",
          desc: p.deskripsi || "",
          bahan: p.bahan || ""
        }));

        produkSiap = true;
        // Buang produk di keranjang yang sudah tidak ada di database
        pesananList.forEach(o => { o.items = o.items.filter(item => cariProduk(item.id)); });
        simpanKeranjang();
        tampilkan();

      } catch (error) {
        produkSiap = false;
        app.innerHTML = `
          <div class="panel empty">
            <h3>Produk belum dapat dimuat</h3>
            <p>${escapeHTML(error.message)}</p>
            <p>Pastikan Laragon aktif (Apache dan MySQL menyala).</p>
            <br>
            <button class="btn btn-primary" data-a="retry">Coba Lagi</button>
          </div>`;
      }
    }

        <div class="panel steps">
          <div class="step"><span>1</span><div><b>Pilih jumlah</b>Tambahkan pisang sale ke keranjang.</div></div>
          <div class="step"><span>2</span><div><b>Isi data</b>Lengkapi nama, nomor WhatsApp, dan metode penerimaan.</div></div>
          <div class="step"><span>3</span><div><b>Konfirmasi</b>Kami menghubungi kamu lewat WhatsApp.</div></div>
        </div>`;
    }

    // ----- Keranjang (satu kotak per pesanan) -----
    function halamanKeranjang() {
      const kartu = pesananList.map((o, idx) => {
        const aktif = o.uid === aktifUid;
        const uid = escapeHTML(o.uid);

        const baris = o.items.map(item => {
          const p = cariProduk(item.id);
          if (!p) return "";
          return `
            <div class="cart-row">
              <div>
                <h3>${escapeHTML(p.name)}</h3>
                <p>${rupiah(p.price)} per bungkus</p>
                <p><b>Subtotal: ${rupiah(p.price * item.qty)}</b></p>
              </div>
              <div class="qty-control">
                <button data-a="kurang" data-uid="${uid}" data-id="${p.id}">−</button>
                <b>${item.qty}</b>
                <button data-a="tambah" data-uid="${uid}" data-id="${p.id}">+</button>
                <button class="btn btn-danger" data-a="hapus" data-uid="${uid}" data-id="${p.id}">Hapus</button>
              </div>
            </div>`;
        }).join("");

        return `
          <div class="panel order-panel ${aktif ? "aktif" : ""}">
            <div class="order-head">
              <input class="label-input" data-a="nama-pesanan" data-uid="${uid}" value="${escapeHTML(o.nama)}" maxlength="40" placeholder="Pesanan ${idx + 1}: ketik nama pemesan (opsional)" aria-label="Nama pesanan">
              ${aktif
                ? '<span class="badge-aktif">Sedang dipakai</span>'
                : `<button class="btn btn-light" data-a="aktifkan" data-uid="${uid}">Pakai pesanan ini</button>`}
            </div>

            ${o.items.length ? baris : '<div class="order-empty">Belum ada produk di pesanan ini.</div>'}

            ${o.items.length ? `<div class="total-row"><span>Total</span><span>${rupiah(hitungTotal(o))}</span></div>` : ""}

            <div class="order-actions">
              <button class="btn btn-primary" data-a="checkout" data-uid="${uid}" ${o.items.length ? "" : "disabled"}>Lanjut ke Pemesanan</button>
              ${pesananList.length > 1 || o.items.length ? `<button class="btn btn-danger" data-a="hapus-pesanan" data-uid="${uid}">Hapus Pesanan</button>` : ""}
            </div>
          </div>`;
      }).join("");

      return `
        <p class="order-note">Tiap pesanan dikirim sendiri-sendiri dan tidak tercampur. Produk baru hanya masuk ke pesanan yang bertanda <b>Sedang dipakai</b>. Mau menambah produk untuk pemesan yang sama? Pakai tombol + di dalam pesanannya.</p>
        ${kartu}
        <div class="order-actions">
          <button class="btn btn-light" data-a="pesanan-baru">+ Pesanan Baru (pemesan lain)</button>
          <button class="btn btn-light" data-a="katalog">Lihat Produk</button>
        </div>`;
    }

    // ----- Formulir pemesanan -----
    function halamanCheckout() {
      const o = cariPesanan(checkoutUid);

      if (!o || !o.items.length) {
        return `
          <div class="panel empty">
            <h3>Belum ada pesanan yang dipilih</h3>
            <p>Pilih pesanan yang mau dilanjutkan dari keranjang.</p>
            <br>
            <button class="btn btn-primary" data-a="keranjang">Buka Keranjang</button>
          </div>`;
      }

      const ringkasan = o.items.map(item => {
        const p = cariProduk(item.id);
        if (!p) return "";
        return `
          <div class="cart-row">
            <div>
              <h3>${escapeHTML(p.name)}</h3>
              <p>${item.qty} bungkus × ${rupiah(p.price)}</p>
            </div>
            <b>${rupiah(p.price * item.qty)}</b>
          </div>`;
      }).join("");

      return `
        <div class="panel">
          <h2 style="margin-bottom:18px">Data Pemesan</h2>
          <div class="notice">Kamu sedang mengisi data untuk <b>${escapeHTML(namaPesanan(o))}</b>. Pastikan data sudah benar agar penjual dapat menghubungi dan memproses pesanan.</div>

          <form id="formPesanan">
            <div class="form-grid">
              <div class="field">
                <label for="nama">Nama Lengkap</label>
                <input id="nama" name="nama" autocomplete="off" required maxlength="100" value="${escapeHTML(o.nama)}" placeholder="Ketik nama lengkap kamu">
              </div>
              <div class="field">
                <label for="hp">Nomor WhatsApp</label>
                <input id="hp" name="hp" type="tel" inputmode="tel" autocomplete="off" required maxlength="20" placeholder="Ketik nomor WhatsApp kamu">
              </div>
              <div class="field full">
                <label>Metode Penerimaan</label>
                <div class="radio-box">
                  <label class="radio-option"><input type="radio" name="metode" value="ambil" checked> Ambil Sendiri</label>
                  <label class="radio-option"><input type="radio" name="metode" value="antar"> Diantar</label>
                </div>
              </div>
              <div class="field full" id="alamatField" style="display:none">
                <label for="alamat">Alamat Pengantaran</label>
                <textarea id="alamat" name="alamat" placeholder="Masukkan alamat lengkap"></textarea>
              </div>
              <div class="field full">
                <label for="catatan">Catatan Tambahan (Opsional)</label>
                <textarea id="catatan" name="catatan" placeholder="Tambahkan catatan jika ada"></textarea>
              </div>
            </div>

            <div class="section-head">
              <div><h2>Ringkasan Pesanan</h2><p>Periksa kembali produk yang akan dipesan.</p></div>
            </div>

            ${ringkasan}

            <div class="total-row"><span>Total Pembayaran</span><span>${rupiah(hitungTotal(o))}</span></div>
            <div id="pesanError" class="error-text"></div>
            <button class="btn btn-primary btn-block" id="btnKirim" type="submit">Buat Pesanan</button>
          </form>
        </div>`;
    }

    // ----- Pesanan berhasil (dengan animasi kurir) -----
    function halamanSelesai() {
      if (!pesananJadi) {
        halaman = "katalog";
        return halamanKatalog();
      }
      const sisa = pesananList.filter(o => o.items.length).length;
      return `
        <div class="panel success">
          <div class="success-icon">✅</div>
          <h2>Pesanan Berhasil Dibuat!</h2>
          <p style="margin-bottom:12px"><b>Pesananmu segera diberikan.</b></p>
          ${gambarKurir()}
          <div class="order-code">Atas nama: ${escapeHTML(pesananJadi.nama)}</div>
          <p>Terima kasih! Kami akan menghubungi kamu lewat WhatsApp di nomor <b>${escapeHTML(pesananJadi.hp)}</b> untuk konfirmasi pesanan.</p>
          <div class="success-actions">
            ${sisa ? `<button class="btn btn-primary" data-a="keranjang">Lihat Pesanan Lainnya (${sisa})</button>` : ""}
            <button class="btn btn-light" data-a="selesai">Kembali ke Beranda</button>
          </div>
        </div>`;
    }

    /* =========================================================
       7. MENGIRIM PESANAN KE DATABASE
       Rekap & tanggal pesanan dicatat oleh database (tabel pesanan),
       tidak ditampilkan di web.
       ========================================================= */
    function bacaForm() {
      const data = new FormData($("formPesanan"));
      return {
        nama: String(data.get("nama") || "").trim(),
        hp: String(data.get("hp") || "").trim(),
        metode: data.get("metode") === "antar" ? "antar" : "ambil",
        alamat: String(data.get("alamat") || "").trim(),
        catatan: String(data.get("catatan") || "").trim()
      };
    }

    async function buatPesanan(event) {
      event.preventDefault();

      const form = bacaForm();
      const errorBox = $("pesanError");
      const tombol = $("btnKirim");
      errorBox.textContent = "";

      const o = cariPesanan(checkoutUid);

      // Pemeriksaan isian
      if (!form.nama) { errorBox.textContent = "Nama lengkap wajib diisi."; return; }

      const hpBersih = form.hp.replace(/[^\d+]/g, "");   // buang spasi dan tanda strip
      if (!/^(\+?62|0)8\d{8,12}$/.test(hpBersih)) {
        errorBox.textContent = "Nomor WhatsApp tidak valid. Contoh: 081234567890";
        return;
      }
      form.hp = hpBersih;

      if (form.metode === "antar" && !form.alamat) { errorBox.textContent = "Alamat pengantaran wajib diisi."; return; }
      if (!o || !o.items.length) { errorBox.textContent = "Pesanan ini masih kosong."; return; }

      const items = o.items.map(i => ({ id: Number(i.id), qty: Number(i.qty) }));

      tombol.disabled = true;
      tombol.textContent = "Menyimpan Pesanan...";

      try {
        const response = await fetch(API_PESAN, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...form, items })
        });

        let hasil;
        try { hasil = await response.json(); }
        catch (e) { throw new Error(`Jawaban dari ${API_PESAN} tidak terbaca. Periksa isi file pesan.php.`); }

        if (!response.ok || !hasil.ok) throw new Error(hasil.pesan || "Pesanan gagal disimpan.");

        pesananJadi = { nama: form.nama, hp: form.hp };

        // Hanya pesanan ini yang dihapus. Pesanan pemesan lain tetap aman.
        pesananList = pesananList.filter(x => x.uid !== o.uid);
        if (!pesananList.length) pesananList = [pesananKosong()];
        aktifUid = pesananList[0].uid;
        checkoutUid = null;
        simpanKeranjang();
        bukaHalaman("selesai");

      } catch (error) {
        errorBox.textContent = error.message;
        tombol.disabled = false;
        tombol.textContent = "Buat Pesanan";
      }
    }

    /* =========================================================
       8. KLIK & ISIAN (semua aksi diatur di sini)
       ========================================================= */
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.dataset.page === "checkout") checkoutUid = aktifUid;  // menu Pemesanan = pesanan yang sedang dipakai
        bukaHalaman(btn.dataset.page);
      });
    });

    $("app").addEventListener("click", event => {
      const tombol = event.target.closest("[data-a]");
      if (!tombol) return;
      const id = Number(tombol.dataset.id);
      const uid = tombol.dataset.uid;   // kosong kalau tombol dari beranda (otomatis ke pesanan aktif)

      switch (tombol.dataset.a) {
        case "tambah":        tambahProduk(id, 1, uid); break;
        case "kurang":        ubahJumlah(uid, id, -1); break;
        case "hapus":         hapusProduk(uid, id); break;
        case "pesanan-baru":  pesananBaru(); break;
        case "hapus-pesanan": hapusPesanan(uid); break;
        case "aktifkan":      aktifUid = uid; simpanKeranjang(); tampilkan(); tampilToast(namaPesanan(cariPesanan(uid)) + " sekarang dipakai."); break;
        case "katalog":       bukaHalaman("katalog"); break;
        case "keranjang":     bukaHalaman("keranjang"); break;
        case "checkout":      checkoutUid = uid; bukaHalaman("checkout"); break;
        case "selesai":       pesananJadi = null; bukaHalaman("katalog"); break;
        case "retry":         muatProduk(); break;
      }
    });

    $("app").addEventListener("change", event => {
      const t = event.target;

      // Ganti pesanan tujuan di beranda
      if (t.dataset.a === "pilih") {
        if (cariPesanan(t.value)) { aktifUid = t.value; simpanKeranjang(); tampilkan(); }
        return;
      }

      // Beri nama pesanan di keranjang
      if (t.dataset.a === "nama-pesanan") {
        const o = cariPesanan(t.dataset.uid);
        if (o) { o.nama = t.value.trim(); simpanKeranjang(); }
        return;
      }

      // Tampilkan kolom alamat hanya kalau memilih "Diantar"
      if (t.name !== "metode") return;
      const antar = t.value === "antar";
      $("alamatField").style.display = antar ? "block" : "none";
      $("alamat").required = antar;
    });

    $("app").addEventListener("submit", event => {
      if (event.target.id === "formPesanan") buatPesanan(event);
    });

    /* =========================================================
       9. MULAI
       ========================================================= */
    muatKeranjang();
    muatProduk();
  </script>
</body>
</html>
